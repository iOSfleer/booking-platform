version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: booking_platform
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src/backend/BookingPlatform.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=booking_platform;Username=booking_user;Password=booking_pass
      Jwt__Issuer: BookingPlatform
      Jwt__Audience: BookingPlatformClients
      Jwt__Key: CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_123456789
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
    environment:
      NEXT_PUBLIC_COMPANY_ID: 11111111-1111-1111-1111-111111111111
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
